name: CI
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - '*'

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

  lint:
    name: Lint
    needs: [ validation ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Save Gradle Caches
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/
          key: gradle-caches-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-caches-${{ runner.os }}-
      - name: Lint
        run: ./gradlew lintAll
      - name: Stop Gradle
        run: ./gradlew --stop

  detekt:
    name: Detekt
    needs: [ validation ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Save Gradle Caches
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/
          key: gradle-caches-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-caches-${{ runner.os }}-
      - name: Detekt
        run: ./gradlew detektAll
      - name: Stop Gradle
        run: ./gradlew --stop

  tests:
    name: Tests
    needs: [ validation, lint, detekt ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Save Gradle Caches
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/
          key: gradle-caches-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-caches-${{ runner.os }}-
      - name: Unit tests
        run: ./gradlew clean testDebugUnitTest
      - name: Stop Gradle
        run: ./gradlew --stop
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
